    <div class="cd-notice"><strong>按审核通过衡量渠道贡献</strong><span>支持渠道、项目双向汇总，下钻至招募单；以下筛选仅作用于本看板。</span></div>
    <div class="cd-filters">${select('统计范围','period',[['all','累计申请'],['30','近30天申请'],['7','近7天申请']])}${select('项目','project',[['','全部项目'],...projects.map(p=>[p.id,p.id+' · '+p.name])])}${select('渠道','channel',[['','全部渠道'],...channels.map(c=>[c,c])])}${select('招募单状态','status',[['','全部状态'],['招募中','招募中'],['招募结束','招募结束'],['已暂停','已暂停']])}<label class="cd-search"><span>搜索</span><input type="search" data-query aria-label="搜索项目、渠道或招募单" placeholder="项目、渠道或招募单" value="${esc(state.query)}"></label><button class="cd-button" data-action="reset">重置</button></div>
    <div class="cd-metrics">${metric('申请人次',fmt(s.apps),`${s.projects} 个项目 · ${s.orders} 个招募单`,'同一用户在同一招募单计一次；跨招募单累计为人次。')}${metric('通过人次',fmt(s.pass),`通过用户 ${fmt(s.uniquePass)} 人（跨单去重）`,'当前申请集合中，统计截至日已审核通过的申请记录数。')}${metric('审核通过率',rate(s.rate),`已审核 ${fmt(s.pass+s.reject)} 人次`,'通过 ÷（通过 + 拒绝）；待审核不计入分母。')}${metric('待审核人次',fmt(s.pending),`申请转通过率 ${s.apps?(s.pass/s.apps*100).toFixed(1)+'%':'—'}`,'申请转通过率 = 通过 ÷ 全部申请；包含尚未审核的申请。')}</div>
    <div class="cd-table-toolbar"><div class="cd-segment" role="group" aria-label="汇总维度">${[['channel','按渠道汇总'],['project','按项目汇总']].map(([k,t])=>`<button data-view="${k}" aria-pressed="${state.view===k}">${t}</button>`).join('')}</div><span class="cd-muted">${'点击 + 展开'+(state.view==='project'?'渠道':'项目')+'贡献'} · 共 ${gs.length} 项</span></div>
    <div class="cd-table-wrap"><table aria-label="渠道贡献汇总表"><thead><tr><th>${state.view==='project'?'项目':'渠道名称'}</th><th title="${state.view==='project'?'有申请记录的渠道数 / 招募单数':'有申请记录的去重项目数 / 招募单数'}">${state.view==='project'?'渠道 / 招募单':'项目 / 招募单'}</th>${sortHead('申请人次','apps')}${sortHead('通过人次','pass')}${sortHead('待审核','pending')}${sortHead('审核通过率','rate')}<th title="本行通过人次 ÷ 当前筛选结果总通过人次。未归因包含在分母。">通过贡献 ⓘ</th><th>操作</th></tr></thead><tbody>${gs.length?`<tr class="cd-total">${rowCells(s,s,`当前筛选合计<span class="cd-sub">去重用户 ${fmt(s.unique)} 人</span>`,'—')}</tr>`:''}${gs.slice((state.page-1)*10,state.page*10).map(g=>{
    const isProject=kind==='project',p=isProject?projectById[g.key]:null;
    const name=isProject?p.name:g.key,sub=isProject?`${p.id} · ${p.domain}`:g.key==='未归因'?'缺失渠道来源，保留纳入总量':g.apps?`${g.projects} 个项目有申请`:'暂无申请记录';
    const expanded=state.expanded.has(g.key);let first=`<div class="cd-entity">${`<button class="cd-expand" data-expand="${esc(g.key)}" aria-expanded="${expanded}" aria-label="${expanded?'收起':'展开'}${esc(name)}" ${g.apps?'':'disabled'}>${expanded?'−':'+'}</button>`}<span class="cd-name">${esc(name)}<span class="cd-sub">${esc(sub)}</span></span></div>`;
    let html=`<tr class="cd-master">${rowCells(g,s,first,`<button class="cd-link" data-detail="${esc(g.key)}" data-kind="${kind}" ${g.apps?'':'disabled'}>查看明细</button>`)}</tr>`;
    if(expanded){const children=groups(g.rows,isProject?'channel':'project').sort((a,b)=>b.pass-a.pass);html+=`<tr><td colspan="8" class="cd-child-cell"><div class="cd-children"><div class="cd-child-heading"><span>${esc(name)} · ${isProject?'渠道':'项目'}贡献</span><span>占比以当前${isProject?'项目':'渠道'}通过人次为分母</span></div><div style="overflow:auto"><table aria-label="${esc(name)}展开明细"><thead><tr><th>${isProject?'渠道':'项目'}</th><th>招募单数</th><th>申请人次</th><th>通过人次</th><th>审核通过率</th><th>内部贡献</th><th>操作</th></tr></thead><tbody>${children.map(c=>`<tr><td>${esc(isProject?c.key:projectById[c.key].name)}${!isProject?`<span class="cd-sub">${c.key}</span>`:''}</td><td>${c.orders}</td><td>${fmt(c.apps)}</td><td class="cd-number">${fmt(c.pass)}</td><td>${rate(c.rate)}</td><td>${share(c.pass,g.pass)}</td><td><button class="cd-link" data-pair-project="${esc(isProject?g.key:c.key)}" data-pair-channel="${esc(isProject?c.key:g.key)}">招募单明细</button></td></tr>`).join('')}</tbody></table></div></div></td></tr>`;}
    return html;}).join('')}</tbody></table>${!gs.length?'<div class="cd-empty"><strong>没有符合条件的申请记录</strong>请调整筛选条件，或重置后查看全部演示数据。<br><button class="cd-button" data-action="reset" style="margin-top:12px">重置筛选</button></div>':''}</div>
    <div class="cd-footer"><span>通过贡献分母：当前筛选范围 ${fmt(s.pass)} 通过人次（含未归因）</span><div class="cd-pages"><span>共 ${gs.length} 项 · 10 项/页</span><button data-page="${state.page-1}" aria-label="上一页" ${state.page<=1?'disabled':''}>‹</button><span>${state.page} / ${pageCount}</span><button data-page="${state.page+1}" aria-label="下一页" ${state.page>=pageCount?'disabled':''}>›</button></div></div><div class="cd-footnote">申请时间：2026-09-01 至 2026-11-07 · 审核状态截至 2026-11-07 · 人次按招募单累计，用户数按当前范围去重。</div>`;
    if(focus){const input=mount.querySelector('[data-query]');input.focus();if(typeof cursor==='number')try{input.setSelectionRange(cursor,cursor);}catch{}}
  }
  function toast(msg){document.querySelector('.cd-toast')?.remove();const t=document.createElement('div');t.className='cd-toast';t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),3400);}
  function closeDrawer(){const o=document.querySelector('.cd-overlay');if(o){o.remove();document.removeEventListener('keydown',trapKeys);lastFocus?.focus();}}
  let lastFocus=null;
  function trapKeys(e){const o=document.querySelector('.cd-overlay');if(!o)return;if(e.key==='Escape'){closeDrawer();return;}if(e.key==='Tab'){const fs=[...o.querySelectorAll('button, summary, a, input')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus();}}}
  function drawer(title,body){closeDrawer();lastFocus=document.activeElement;const o=document.createElement('div');o.className='cd-overlay';o.innerHTML=`<aside class="cd-drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="cd-close" aria-label="关闭明细">×</button><h2>${esc(title)}</h2>${body}</aside>`;document.body.append(o);o.querySelector('.cd-close').onclick=closeDrawer;o.onclick=e=>{if(e.target===o)closeDrawer();};document.addEventListener('keydown',trapKeys);o.querySelector('.cd-close').focus();}
  function openDetails(kind,key,pair){let rows=filtered(),title='';if(pair){rows=rows.filter(e=>e.project===pair.project&&e.channel===pair.channel);title=`${pair.channel} · ${pair.project}`;}else if(kind==='channel'){rows=rows.filter(e=>e.channel===key);title=key;}else if(kind==='project'){rows=rows.filter(e=>e.project===key);title=projectById[key].name;}else{const [rid,ch]=key.split('|');rows=rows.filter(e=>e.order===rid&&e.channel===ch);title=orderById[rid].name;}
    const s=stats(rows),gs=groups(rows,'detail').sort((a,b)=>b.pass-a.pass);
    drawer(title,`<p>招募单 × 渠道明细 <span class="cd-pill">演示数据</span><br>沿用当前筛选 · 截至 2026-11-07</p><div class="cd-drawer-stats"><div>申请人次<strong>${fmt(s.apps)}</strong></div><div>通过人次<strong>${fmt(s.pass)}</strong></div><div>审核通过率<strong>${rate(s.rate)}</strong></div><div>通过用户（去重）<strong>${fmt(s.uniquePass)}</strong></div></div><button class="cd-button" data-drawer-export>↓ 导出这些明细</button><h4>${s.orders} 个招募单 · ${gs.length} 条渠道明细</h4><div class="cd-drawer-table"><table><thead><tr><th>招募单 / 项目</th><th>渠道</th><th>申请</th><th>通过</th><th>待审核</th><th>通过率</th></tr></thead><tbody>${gs.map(g=>{const [rid,ch]=g.key.split('|'),r=orderById[rid];return `<tr><td>${esc(r.name)}<small>${r.project} · ${rid} · ${r.status}</small></td><td>${esc(ch)}</td><td>${g.apps}</td><td style="color:#009d75">${g.pass}</td><td>${g.pending}</td><td>${rate(g.rate)}</td></tr>`;}).join('')}</tbody></table></div><p>人次可跨招募单汇总；通过用户在当前明细范围按用户 ID 去重，不能将各行去重人数直接相加。</p>`);
    document.querySelector('[data-drawer-export]').onclick=()=>exportCSV(rows,'detail');
  }
  function requirements(){drawer('必要需求点',`<ol><li><strong>入口：</strong>在“按领域查看、招募单排行”后增加“渠道统计”。</li><li><strong>汇总：</strong>提供按渠道、按项目两个视图，展示申请、通过、待审核、审核通过率与贡献占比。</li><li><strong>下钻：</strong>渠道行展开项目，项目行展开渠道；从当前行查看关联招募单。</li><li><strong>筛选：</strong>支持时间范围、项目、渠道、招募单状态及关键词；指标、表格、下钻与导出同步更新。</li><li><strong>统计：</strong>申请按“招募单×用户”去重后累计为人次；通过用户按当前范围去重；审核通过率按通过÷已审核计算。</li><li><strong>归因与占比：</strong>每次申请归属一个项目、招募单和渠道；来源缺失计入“未归因”；主表贡献以筛选总量为分母，展开贡献以父行为分母。</li><li><strong>表格操作：</strong>默认按通过人次降序；支持排序、分页；切换汇总维度保留筛选。</li><li><strong>导出与空结果：</strong>导出当前筛选范围及筛选条件；空结果提供重置入口，零分母的比率显示“—”。</li></ol>`);}
  function rules(){drawer('统计口径',`<ul><li><strong>申请人次：</strong>同一用户在同一招募单计一次，跨招募单累计。</li><li><strong>通过人次：</strong>筛选出的申请中，截至统计日审核通过的记录数。</li><li><strong>通过用户：</strong>在当前范围内按用户ID去重。</li><li><strong>审核通过率：</strong>通过 ÷（通过 + 拒绝）。</li><li><strong>申请转通过率：</strong>通过 ÷ 全部申请。</li><li><strong>通过贡献：</strong>行通过人次 ÷ 当前筛选结果总通过人次；展开表以父行通过人次为分母。</li><li><strong>渠道归因：</strong>使用提交申请时记录的渠道；缺失来源计入“未归因”。项目取招募单所属项目。</li><li><strong>时间：</strong>按申请时间筛选，UTC+0，T+1；审核状态取统计截至日快照。</li><li><strong>零分母：</strong>比率显示“—”。</li></ul>`);}
  function exportCSV(rows,kind){const s=stats(rows),gs=sorted(groups(rows,kind,kind==='channel'));const head=['数据类型','统计截至','统计范围','汇总维度','项目ID','项目名称','招募单ID','招募单名称','渠道','申请人次','通过人次','拒绝人次','待审核人次','审核通过率','通过贡献','贡献分母_通过人次','筛选项目','筛选渠道','筛选招募单状态','搜索条件'];const data=gs.map(g=>{let pid='',rid='',ch='';if(kind==='project')pid=g.key;else if(kind==='channel')ch=g.key;else{[rid,ch]=g.key.split('|');pid=orderById[rid].project;}return ['演示数据','2026-11-07',state.period==='all'?'累计申请':`近${state.period}天申请`,kind,pid,pid?projectById[pid].name:'',rid,rid?orderById[rid].name:'',ch,g.apps,g.pass,g.reject,g.pending,rate(g.rate),s.pass?(g.pass/s.pass*100).toFixed(2)+'%':'—',s.pass,state.project||'全部项目',state.channel||'全部渠道',state.status||'全部状态',state.query];});
    const csv='\uFEFF'+[head,...data].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Atlas_渠道贡献_演示_${kind}_20261107.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`已导出 ${gs.length} 条${kind==='detail'?'招募单渠道明细':'汇总'}（演示数据）`);return {count:gs.length,csv};
  }
  mount.addEventListener('change',e=>{const k=e.target.dataset.filter;if(k){state[k]=e.target.value;state.page=1;state.expanded.clear();render();}});
  mount.addEventListener('input',e=>{if(e.target.hasAttribute('data-query')){state.query=e.target.value;state.page=1;state.expanded.clear();render();}});
  mount.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.action==='reset'){Object.assign(state,{project:'',channel:'',status:'',period:'all',query:'',page:1});state.expanded.clear();render();}else if(d.action==='requirements')requirements();else if(d.action==='rules')rules();else if(d.action==='export')exportCSV(filtered(),state.view==='project'?'project':'channel');else if(d.view){state.view=d.view;state.page=1;state.expanded.clear();render();}else if(d.sort){if(state.sort===d.sort)state.direction*=-1;else{state.sort=d.sort;state.direction=-1;}render();}else if(d.expand){state.expanded.has(d.expand)?state.expanded.delete(d.expand):state.expanded.add(d.expand);render();}else if(d.detail){openDetails(d.kind,d.detail);}else if(d.pairProject){openDetails(null,null,{project:d.pairProject,channel:d.pairChannel});}else if(d.page){state.page=Number(d.page);render();}});
  function deactivate(){if(!state.active)return;state.active=false;mount.hidden=true;tab.className='';closeDrawer();previousHidden.forEach((v,n)=>n.style.display=v);originalClasses.forEach(([n,c])=>n.className=c);}
  const nativeHandlers=[...tabs.children].filter(n=>n!==tab).map(n=>{const fn=()=>deactivate();n.addEventListener('click',fn,true);return [n,fn];});
  function open(){if(!state.active){originalClasses=[...tabs.children].filter(n=>n!==tab).map(n=>[n,n.className]);previousHidden.clear();[...[...host.children].filter(n=>n!==header&&n!==mount),...[...header.children].filter(n=>n!==tabs)].forEach(n=>{previousHidden.set(n,n.style.display);n.style.display='none';});}state.active=true;[...tabs.children].filter(n=>n!==tab).forEach(n=>n.className='');tab.className=(activeClass+' cd-tab-on').trim();mount.hidden=false;render();}
  tab.onclick=open;
  window.__atlasChannelDemo={open,version:'1.1',getSummary:()=>stats(filtered()),getState:()=>({...state,expanded:[...state.expanded]}),verify:()=>({events:events.length,uniqueApplicationKeys:new Set(events.map(e=>e.order+'|'+e.user)).size,stats:stats(events),channelPassSum:groups(events,'channel').reduce((a,g)=>a+g.pass,0),projectPassSum:groups(events,'project').reduce((a,g)=>a+g.pass,0),orderChannelPassSum:groups(events,'detail').reduce((a,g)=>a+g.pass,0)}),remove:()=>{deactivate();nativeHandlers.forEach(([n,fn])=>n.removeEventListener('click',fn,true));mount.remove();tab.remove();style.remove();delete window.__atlasChannelDemo;}};
  open();host.scrollIntoView({block:'start',behavior:'instant'});
})();
</script></body></html>
