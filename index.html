  function requirements(){drawer('渠道管理统计看板 · 需求说明','<h3>1. 入口与默认展示</h3><p>入口：众包招募管理 → 招募渠道管理。页面提供“渠道概览”和“渠道管理统计看板”两个页签；原有“渠道管理”配置按钮继续使用。</p><p>看板默认按渠道汇总，范围为累计申请、全部项目、全部渠道、全部招募单状态，按通过人次降序。页面显示统计截至日、UTC+0与T+1。</p>\n<h3>2. 展示字段</h3><p>顶部展示申请人次、通过人次、审核通过率、待审核人次；辅助显示覆盖项目/招募单数、去重通过用户数、已审核人次和申请转通过率。</p><div class="cd-req-table"><table><thead><tr><th>区域</th><th>字段</th><th>展示说明</th></tr></thead><tbody><tr><td>主表</td><td>渠道/项目名称</td><td>按渠道展示渠道名；按项目展示项目名、编号、领域。</td></tr><tr><td>主表</td><td>申请、通过、待审核</td><td>当前行范围内对应状态的有效申请人次。</td></tr><tr><td>主表</td><td>审核通过率、通过贡献</td><td>分别展示审核通过比例及占筛选总通过人次的比例。</td></tr><tr><td>主表</td><td>当前筛选合计、操作</td><td>合计按完整结果计算；“查看明细”打开招募单抽屉。</td></tr><tr><td>展开表</td><td>项目/渠道、招募单数、申请、通过、审核通过率、内部贡献、操作</td><td>渠道展开项目，项目展开渠道；内部贡献以父行通过人次为分母。</td></tr></tbody></table></div><p>主表移除“项目/招募单”和“渠道/招募单”组合数量列。数量为千分位整数，比率保留1位小数，零分母显示“—”。</p>\n<h3>3. 指标定义与归因</h3><div class="cd-req-table"><table><thead><tr><th>指标</th><th>定义</th></tr></thead><tbody><tr><td>申请人次</td><td>按招募单ID×用户ID确定唯一有效申请，状态取截至日最新有效申请状态；跨招募单累计为人次。</td></tr><tr><td>通过 / 拒绝 / 待审核</td><td>分别对应审核通过、审核拒绝和尚未完成审核。已审核=通过+拒绝。</td></tr><tr><td>通过用户数</td><td>当前范围内，对通过申请的用户ID去重。</td></tr><tr><td>审核通过率</td><td>通过 ÷（通过+拒绝）。</td></tr><tr><td>申请转通过率</td><td>通过 ÷ 申请，分母包含待审核。</td></tr><tr><td>通过贡献 / 内部贡献</td><td>主表：行通过 ÷ 当前筛选总通过；展开表：行通过 ÷ 当前父行通过。</td></tr><tr><td>招募单数</td><td>当前范围内至少有一条有效申请的去重招募单ID数量。</td></tr><tr><td>渠道与项目</td><td>渠道使用提交申请时记录的渠道ID，缺失来源计入“未归因”并计入总量；项目取招募单所属项目。</td></tr><tr><td>时间</td><td>按申请提交时间筛选，UTC+0、T+1；审核状态取统计截至日快照。</td></tr></tbody></table></div>\n<h3>4. 筛选与搜索</h3><p>支持累计、近30天、近7天，项目、渠道、招募单状态及关键词。关键词匹配渠道名、项目名/编号、招募单名/编号，多个条件取交集。指标、主表、展开表、抽屉和导出同步使用筛选结果。</p><p>修改筛选后回到第1页并收起展开行；切换汇总维度保留筛选与主表排序，回到第1页并收起展开行；重置恢复默认筛选、通过人次降序及第1页。</p>\n<h3>5. 排序与Tooltip</h3><p>主表可排序：申请、通过、待审核、审核通过率、通过贡献。展开表可排序：招募单数、申请、通过、审核通过率、内部贡献。</p><p>默认通过人次降序。新字段首次点击为降序，再次点击切换升序，箭头标识当前方向。主表先对全部结果排序再分页；展开表只排序当前父行。相同数值按通过人次、申请人次降序，再按名称升序；无分母的比率排末尾。</p><p>顶部指标与表头提供说明图标。悬停、聚焦或点击显示定义、公式、去重方式；贡献说明包含分母范围。说明图标独立于排序按钮，点击说明不触发排序。</p>\n<h3>6. 点击与下钻</h3><p>点击“+”或名称展开项目/渠道，再次点击收起，允许多行展开。主表“查看明细”打开当前渠道或项目的招募单×渠道记录；展开表“招募单明细”限定为当前项目×渠道。</p><p>抽屉展示招募单名称、编号、项目、状态、渠道、申请、通过、待审核、审核通过率及顶部合计。关闭按钮、遮罩、Escape均可关闭，返回后保留筛选、排序、展开与页码。</p>\n<h3>7. 分页、导出与结果状态</h3><p>主表每页10行，合计行不占行数。导出全部筛选结果并保留排序，包含统计截至日、汇总维度、筛选条件、指标和占比分母；抽屉可导出当前明细。</p><p>空结果显示重置入口并禁用导出。零申请渠道保留为0，禁用展开和明细入口。</p>\n');document.querySelector('.cd-drawer').classList.add('cd-requirements');}
  function rules(){drawer('统计口径',`<ul><li><strong>申请人次：</strong>同一用户在同一招募单计一次，跨招募单累计。</li><li><strong>通过人次：</strong>筛选出的申请中，截至统计日审核通过的记录数。</li><li><strong>通过用户：</strong>在当前范围内按用户ID去重。</li><li><strong>审核通过率：</strong>通过 ÷（通过 + 拒绝）。</li><li><strong>申请转通过率：</strong>通过 ÷ 全部申请。</li><li><strong>通过贡献：</strong>行通过人次 ÷ 当前筛选结果总通过人次；展开表以父行通过人次为分母。</li><li><strong>渠道归因：</strong>使用提交申请时记录的渠道；缺失来源计入“未归因”。项目取招募单所属项目。</li><li><strong>时间：</strong>按申请时间筛选，UTC+0，T+1；审核状态取统计截至日快照。</li><li><strong>零分母：</strong>比率显示“—”。</li></ul>`);}
  function exportCSV(rows,kind){const s=stats(rows),gs=sorted(groups(rows,kind,kind==='channel'));const head=['数据类型','统计截至','统计范围','汇总维度','项目ID','项目名称','招募单ID','招募单名称','渠道','申请人次','通过人次','拒绝人次','待审核人次','审核通过率','通过贡献','贡献分母_通过人次','筛选项目','筛选渠道','筛选招募单状态','搜索条件'];const data=gs.map(g=>{let pid='',rid='',ch='';if(kind==='project')pid=g.key;else if(kind==='channel')ch=g.key;else{[rid,ch]=g.key.split('|');pid=orderById[rid].project;}return ['演示数据','2026-11-07',state.period==='all'?'累计申请':`近${state.period}天申请`,kind,pid,pid?projectById[pid].name:'',rid,rid?orderById[rid].name:'',ch,g.apps,g.pass,g.reject,g.pending,rate(g.rate),s.pass?(g.pass/s.pass*100).toFixed(2)+'%':'—',s.pass,state.project||'全部项目',state.channel||'全部渠道',state.status||'全部状态',state.query];});
    const csv='\uFEFF'+[head,...data].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Atlas_渠道贡献_演示_${kind}_20261107.csv`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast(`已导出 ${gs.length} 条${kind==='detail'?'招募单渠道明细':'汇总'}（演示数据）`);return {count:gs.length,csv};
  }
  mount.addEventListener('change',e=>{const k=e.target.dataset.filter;if(k){state[k]=e.target.value;state.page=1;state.expanded.clear();render();}});
  mount.addEventListener('input',e=>{if(e.target.hasAttribute('data-query')){state.query=e.target.value;state.page=1;state.expanded.clear();render();}});
  mount.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||b.hasAttribute('data-tip'))return;const d=b.dataset;if(d.action==='reset'){Object.assign(state,{project:'',channel:'',status:'',period:'all',query:'',sort:'pass',direction:-1,page:1,childSort:{}});state.expanded.clear();render();}else if(d.action==='requirements')requirements();else if(d.action==='rules')rules();else if(d.action==='export')exportCSV(filtered(),state.view==='project'?'project':'channel');else if(d.view){state.view=d.view;state.page=1;state.expanded.clear();state.childSort={};render();}else if(d.childSort){const current=state.childSort[d.parent]||{sort:'pass',direction:-1};state.childSort[d.parent]={sort:d.childSort,direction:current.sort===d.childSort?-current.direction:-1};render();}else if(d.sort){if(state.sort===d.sort)state.direction*=-1;else{state.sort=d.sort;state.direction=-1;}state.page=1;render();}else if(d.expand){state.expanded.has(d.expand)?state.expanded.delete(d.expand):state.expanded.add(d.expand);render();}else if(d.detail){openDetails(d.kind,d.detail);}else if(d.pairProject){openDetails(null,null,{project:d.pairProject,channel:d.pairChannel});}else if(d.page){state.page=Number(d.page);render();}});
  function deactivate(){state.active=false;mount.hidden=true;tab.className='';overviewTab.className='cd-nav-active';closeDrawer();hideTooltip();previousHidden.forEach((v,n)=>n.style.display=v);}
  function open(){state.active=true;nativeContent.forEach(n=>n.style.display='none');overviewTab.className='';tab.className='cd-tab-on';mount.hidden=false;render();}
  overviewTab.onclick=deactivate;tab.onclick=open;
  const demoOverview=host.querySelector('[data-demo-channel-overview]');
  if(demoOverview){demoOverview.innerHTML=`<div class="cd-overview-title">渠道概览 <span>演示数据</span></div><div class="cd-overview-scroll"><table aria-label="渠道概览表"><thead><tr><th>渠道名称</th><th>代码</th><th>点击次数</th><th>注册人数</th><th>申请人数</th><th>已招募人数</th></tr></thead><tbody>${channels.map((c,i)=>{const g=stats(events.filter(e=>e.channel===c));return `<tr><td>${esc(c)}</td><td>${i===8?-1:i===9?'—':i+1}</td><td>${fmt(g.apps*5)}</td><td>${fmt(Math.round(g.apps*1.3))}</td><td>${fmt(g.apps)}</td><td>${fmt(g.pass)}</td></tr>`;}).join('')}</tbody></table></div>`;}

  function hideTooltip(){tipElement?.remove();if(tipTarget)tipTarget.removeAttribute('aria-describedby');tipElement=null;tipTarget=null;tipPinned=false;}
  function showTooltip(button,pinned=false){hideTooltip();tipTarget=button;tipPinned=pinned;tipElement=document.createElement('div');tipElement.className='cd-tooltip';tipElement.id='atlas-metric-tooltip';tipElement.setAttribute('role','tooltip');tipElement.textContent=button.dataset.tip;document.body.append(tipElement);button.setAttribute('aria-describedby',tipElement.id);const r=button.getBoundingClientRect(),t=tipElement.getBoundingClientRect();tipElement.style.left=Math.max(8,Math.min(r.left+r.width/2-t.width/2,window.innerWidth-t.width-8))+'px';tipElement.style.top=(r.bottom+t.height+14>window.innerHeight?Math.max(8,r.top-t.height-8):r.bottom+8)+'px';}
  function tipOver(e){const b=e.target.closest?.('[data-tip]');if(b&&!tipPinned&&b!==tipTarget)showTooltip(b);}
  function tipOut(e){if(tipPinned)return;const b=e.target.closest?.('[data-tip]');if(b&&!b.contains(e.relatedTarget))hideTooltip();}
  function tipFocus(e){const b=e.target.closest?.('[data-tip]');if(b)showTooltip(b);}
  function tipClick(e){const b=e.target.closest?.('[data-tip]');if(b){if(tipTarget===b&&tipPinned)hideTooltip();else showTooltip(b,true);}else hideTooltip();}
  function tipKey(e){if(e.key==='Escape')hideTooltip();}
  document.addEventListener('mouseover',tipOver);document.addEventListener('mouseout',tipOut);document.addEventListener('focusin',tipFocus);document.addEventListener('focusout',tipOut);document.addEventListener('click',tipClick);document.addEventListener('keydown',tipKey);document.addEventListener('scroll',hideTooltip,true);
  window.__atlasChannelDemo={open,version:'2.0',getSummary:()=>stats(filtered()),getState:()=>({...state,expanded:[...state.expanded]}),verify:()=>({events:events.length,uniqueApplicationKeys:new Set(events.map(e=>e.order+'|'+e.user)).size,stats:stats(events),channelPassSum:groups(events,'channel').reduce((a,g)=>a+g.pass,0),projectPassSum:groups(events,'project').reduce((a,g)=>a+g.pass,0)}),remove:()=>{deactivate();document.removeEventListener('mouseover',tipOver);document.removeEventListener('mouseout',tipOut);document.removeEventListener('focusin',tipFocus);document.removeEventListener('focusout',tipOut);document.removeEventListener('click',tipClick);document.removeEventListener('keydown',tipKey);document.removeEventListener('scroll',hideTooltip,true);host.insertBefore(managementButton,originalNextSibling?.parentNode===host?originalNextSibling:header);if(managementStyles===null)managementButton.removeAttribute('style');else managementButton.setAttribute('style',managementStyles);mount.remove();header.remove();style.remove();delete window.__atlasChannelDemo;}};
  open();
})();
</script></body></html>
